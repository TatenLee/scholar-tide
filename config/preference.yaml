# Your personal taste. Used to re-rank articles when --use-embed is on.
#
# The idea: papers like the ones under `likes` should float to the top,
# ones like `dislikes` should sink. You can grow/shrink either list freely.
#
# Optional: `proj_embedding_json` points at a precomputed projection
# vector (schedule: run once with `likes`/`dislikes`, save the result,
# then reuse it to skip live embedding calls every day).

rank:
  likes:
    - "Deep Residual Learning for Image Recognition"
    - "Generative Adversarial Networks"
    - "Attention Is All You Need"
    - "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
    - "Scaling Laws for Neural Language Models"
    - "Denoising Diffusion Probabilistic Models"
    - "Adding Conditional Control to Text-to-Image Diffusion Models"
    # ---- data processing / large-scale data ----
    - "DataComp: In search of the next generation of multimodal datasets"
    - "The Pile: An 800GB Dataset of Diverse Text for Language Modeling"
    - "RedPajama: an Open Dataset for Training Large Language Models"
    - "The RefinedWeb Dataset for Falcon LLM"
    - "LAION-5B: An open large-scale dataset for training next generation image-text models"
    - "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism"
    - "ZeRO: Memory Optimizations Toward Training Trillion Parameter Models"
    - "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness"
    # ---- dataset construction / benchmarks ----
    - "ImageNet: A Large-Scale Hierarchical Image Database"
    - "COCO: Common Objects in Context"
    - "Open X-Embodiment: Robotic Learning Datasets and RT-X Models"
    - "Habitat: A Platform for Embodied AI Research"
    # ---- embodied intelligence ----
    - "PaLM-E: An Embodied Multimodal Language Model"
    - "RT-1: Robotics Transformer for Real-World Control at Scale"
    - "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control"
    - "VoxPoser: Composable 3D Value Maps for Robotic Manipulation with Language Models"
    - "Voyager: An Open-Ended Embodied Agent with Large Language Models"
    - "Octo: An Open-Source Generalist Robot Policy"
    - "LEGENT: Open Platform for Embodied Agents"
    - "EmbodiedGPT: Vision-Language Pre-Training via Embodied Chain of Thought"
  dislikes:
    - "Semantic Segmentation of Unmanned Aerial Vehicle Remote Sensing Images using SegFormer"
    - "LightM-UNet: Mamba Assists in Lightweight UNet for Medical Image Segmentation"
    - "Pika 1.5重磅升级！万物皆可爆炸，搞笑特效全网病毒式疯传"
    - "OpenAI融资70亿，只剩孤家寡人？众人怒揭奥特曼真面目"
  # proj_embedding_json: ./config/proj_embedding.json