<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scholar Tide</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="logo">🌊</span>
        <span>
          <h1>Scholar<span class="accent">Tide</span></h1>
          <p class="tagline">your daily current — chosen by you, not by an algorithm</p>
        </span>
      </div>
      <div class="meta">
        <span id="generatedAt" class="chip">—</span>
        <span id="itemCount" class="chip">—</span>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="toolbar">
      <div id="subjectPills" class="pills" aria-label="filter by subject"></div>
      <input id="search" type="search" placeholder="Filter by title or keyword…" autocomplete="off" />
    </nav>

    <section id="feed" class="feed" aria-live="polite"></section>

    <footer class="site-footer">
      generated by <a href="https://github.com/" id="repoLink">scholar-tide</a> ·
      fetch → embed → rank → render
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
