<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scholar Tide</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌊</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <span class="logo">🌊</span>
        <span>
          <h1>Scholar<span class="accent">Tide</span></h1>
          <p class="tagline">每天发现值得读的前沿论文</p>
        </span>
      </div>
      <div class="meta">
        <span id="generatedAt" class="chip">—</span>
        <span id="itemCount" class="chip">—</span>
      </div>
    </div>
  </header>

  <main class="container">
    <nav class="toolbar" aria-label="筛选论文">
      <div class="datebar">
        <select id="dateSelect" aria-label="日期范围"></select>
        <input id="startDate" type="date" aria-label="开始日期" />
        <span class="sep">→</span>
        <input id="endDate" type="date" aria-label="结束日期" />
        <button id="applyRange" class="btn" type="button">应用日期</button>
      </div>
      <div id="subjectPills" class="pills" aria-label="按类别筛选"></div>
      <input id="search" type="search" placeholder="搜索标题或摘要…" autocomplete="off" />
      <button id="translateTitles" class="btn translate-titles" type="button">翻译当前列表标题</button>
    </nav>

    <p class="translation-note">中文为机器初译，用于快速筛选；科研术语请对照英文原文。</p>

    <section id="feed" class="feed" aria-live="polite"></section>

    <footer class="site-footer">
      <a href="https://github.com/TatenLee/scholar-tide" id="repoLink">Scholar Tide</a> · 每日抓取、筛选与阅读 ·
      <a href="https://github.com/argosopentech/argos-translate">Argos Translate</a> / OPUS-MT 中文初译
    </footer>
  </main>

  <script src="translate.js"></script>
  <script src="app.js"></script>
</body>
</html>
