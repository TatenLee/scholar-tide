name: recurring full-paper translation

on:
  schedule:
    # 14:37, 22:37, 06:37 Beijing/Hong Kong time. First pass follows daily discovery.
    - cron: "37 6,14,22 * * *"
  workflow_dispatch:
    inputs:
      paper_id:
        description: 'Optional recent arXiv ID to translate now (for example 2610.12469v1)'
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: full-paper-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/scholar-tide/models
            ~/.local/share/argos-translate/packages
          key: scholar-tide-argos-en-zh-1.9

      - name: Install package and offline translator
        run: pip install -e ".[translate]"

      - name: Translate this shard
        env:
          PAPER_ID: ${{ github.event.inputs.paper_id }}
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p _paper_outputs/papers
          touch _paper_outputs/papers/empty.txt
          args=(--shard-index "$SHARD" --shard-count 4 --output-dir _paper_outputs/papers --max-minutes 300)
          if [ -n "$PAPER_ID" ]; then args+=(--id "$PAPER_ID"); fi
          python -m engine.translate_papers "${args[@]}" || echo "$?" > "_paper_outputs/papers/failure-shard-$SHARD.txt"

      - name: Upload this shard's completed papers
        uses: actions/upload-artifact@v4
        with:
          name: paper-translations-${{ matrix.shard }}
          path: _paper_outputs/papers
          if-no-files-found: error

  publish:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          pattern: paper-translations-*
          merge-multiple: true
          path: data/papers

      - name: Check shard results
        run: |
          if find data/papers -name 'failure-shard-*.txt' -print -quit | grep -q .; then
            echo "TRANSLATION_FAILED=true" >> "$GITHUB_ENV"
          fi
          rm -f data/papers/empty.txt data/papers/failure-shard-*.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/scholar-tide/models
            ~/.local/share/argos-translate/packages
          key: scholar-tide-argos-en-zh-1.9

      - name: Install package and offline translator
        run: pip install -e ".[translate]"

      - name: Backfill older Chinese titles and abstracts
        id: backfill
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.paper_id == '' }}
        continue-on-error: true
        run: python -m engine.translate_archive --backfill --limit 30

      - name: Prune old full-text translations
        run: python -m engine.translate_papers --limit 0

      - name: Save translations
        run: |
          git config user.name "scholar-tide[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if ! git diff --cached --quiet; then
            git commit -m "build: translate recent arXiv papers"
            for attempt in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
              sleep $((attempt * 10))
            done
            exit 1
          fi

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r frontend/* _site/
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4

      - name: Report translation failures
        if: ${{ env.TRANSLATION_FAILED == 'true' || steps.backfill.outcome == 'failure' }}
        run: exit 1
