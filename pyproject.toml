[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-tide"
version = "0.1.0"
description = "A personalized daily newspaper of academic papers and web news."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.26",
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
embed = ["openai>=1.0"]
rss = ["feedparser>=6.0"]
all = ["openai>=1.0", "feedparser>=6.0"]

[project.scripts]
scholar-tide = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine", "engine.*"]